(function(){
  function applyTheme(theme) {
    var isDark = theme === 'dark';
    document.documentElement.classList.toggle('theme-dark', isDark);
    document.body.classList.toggle('theme-dark', isDark);
    document.getElementById('hljs-light').disabled = isDark;
    document.getElementById('hljs-dark').disabled = !isDark;
    var content = document.getElementById('content');
    if (content) {
      content.classList.toggle('theme-dark', isDark);
      content.setAttribute('data-theme', isDark ? 'dark' : 'light');
      var article = content.querySelector('.markdown-body');
      if (article) article.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }
  }
  function apply() {
    document.getElementById('content').classList.add('markdown-body');
    if (!window.__markeditTheme) {
      var params = new URLSearchParams(window.location.search);
      window.__markeditTheme = params.get('theme') === 'dark' ? 'dark' : 'light';
    }
    applyTheme(window.__markeditTheme);
  }
  window.setTheme = function(theme) {
    window.__markeditTheme = theme === 'dark' ? 'dark' : 'light';
    applyTheme(window.__markeditTheme);
  };
  var link = document.getElementById('gh-css-local');
  link.onload = apply;
  link.onerror = apply;
})();
</script>

const documentBase = document.createElement('base');
documentBase.href = 'https://document.local/';
document.head.appendChild(documentBase);
let zoomSeq = 0;
let suppressScrollPost = false;
let scrollPostPending = false;

function sourceLine(element) {
  const match = element && element.getAttribute('data-sourcepos')?.match(/^(\d+):/);
  return match ? Number(match[1]) : 0;
}

function sourceBlocks() {
  return Array.from(document.querySelectorAll('#content [data-sourcepos]'))
    .filter((element) => sourceLine(element) > 0 && element.offsetParent !== null);
}

function sourceTop(element) {
  return element.getBoundingClientRect().top + window.scrollY;
}

window.scrollToSourceLine = function(line) {
  const blocks = sourceBlocks();
  if (!blocks.length) return;
  let current = blocks[0], next = null;
  for (let i = 0; i < blocks.length; i++) {
    const blockLine = sourceLine(blocks[i]);
    if (blockLine > line) { next = blocks[i]; break; }
    current = blocks[i];
  }
  let top = sourceTop(current);
  if (next) {
    const first = sourceLine(current), last = sourceLine(next);
    const ratio = last > first ? Math.max(0, Math.min(1, (line - first) / (last - first))) : 0;
    top += (sourceTop(next) - sourceTop(current)) * ratio;
  }
  suppressScrollPost = true;
  window.scrollTo(0, Math.max(0, top - 12));
  setTimeout(() => { suppressScrollPost = false; }, 80);
};

window.addEventListener('scroll', () => {
  if (suppressScrollPost || scrollPostPending) return;
  scrollPostPending = true;
  requestAnimationFrame(() => {
    scrollPostPending = false;
    if (suppressScrollPost || !window.chrome?.webview) return;
    const blocks = sourceBlocks();
    if (!blocks.length) return;
    const top = window.scrollY + 18;
    let current = blocks[0];
    for (const block of blocks) {
      if (sourceTop(block) > top) break;
      current = block;
    }
    const line = sourceLine(current);
    if (line) window.chrome.webview.postMessage('scroll:' + line);
  });
}, { passive: true });

/* Replaces :shortcode: emoji and [[wiki-link]] / [[wiki-link|label]] text
   with real content in a single pass per text node, skipping text that's
   already inside a link, code, or script/style so source-looking spans
   (URLs, code samples) are never rewritten. A wiki-link becomes a real
   click target that asks the native host to open (or offer to create) the
   named note - see the "wikilink:" case in WebMessage_Invoke. */
function enhanceInlineText(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const skip = node.parentElement && node.parentElement.closest('a,code,pre,script,style');
      return skip ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let node;
  while ((node = walker.nextNode())) nodes.push(node);

  const pattern = /:([a-z0-9_+-]+):|\[\[([^[\]|]+)(?:\|([^[\]]+))?\]\]/g;
  nodes.forEach((textNode) => {
    const text = textNode.nodeValue;
    pattern.lastIndex = 0;
    if (!pattern.test(text)) return;
    pattern.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, match;
    while ((match = pattern.exec(text))) {
      if (match.index > last) frag.appendChild(document.createTextNode(text.slice(last, match.index)));
      if (match[1] !== undefined) {
        const emoji = EMOJI_MAP[match[1]];
        frag.appendChild(document.createTextNode(emoji || match[0]));
      } else {
        const target = match[2].trim();
        const label = (match[3] || match[2]).trim();
        const link = document.createElement('a');
        link.href = '#';
        link.className = 'wikilink';
        link.textContent = label;
        link.addEventListener('click', (event) => {
          event.preventDefault();
          window.chrome?.webview?.postMessage('wikilink:' + encodeURIComponent(target));
        });
        frag.appendChild(link);
      }
      last = match.index + match[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    textNode.replaceWith(frag);
  });
}

function enhanceAlerts(root) {
  const alertNames = {
    NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important',
    WARNING: 'Warning', CAUTION: 'Caution'
  };
  root.querySelectorAll('blockquote').forEach((quote) => {
    const firstParagraph = quote.firstElementChild;
    const firstText = firstParagraph && firstParagraph.tagName === 'P' ? firstParagraph.firstChild : null;
    if (!firstText || firstText.nodeType !== Node.TEXT_NODE) return;
    const match = firstText.nodeValue.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:[ \t]*\n|[ \t]+|$)/i);
    if (!match) return;
    const type = match[1].toUpperCase();
    firstText.nodeValue = firstText.nodeValue.slice(match[0].length);
    quote.classList.add('markdown-alert', 'markdown-alert-' + type.toLowerCase());
    const title = document.createElement('p');
    title.className = 'markdown-alert-title';
    title.textContent = alertNames[type];
    quote.insertBefore(title, firstParagraph);
    if (firstParagraph.textContent.trim() === '' && firstParagraph.children.length === 0) {
      firstParagraph.remove();
    }
  });
}

function headingSlug(text) {
  return text.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/['’]/g, '').replace(/[^a-z0-9\u00c0-\uffff]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'section';
}

function navigateToHeading(event, heading, id) {
  event.preventDefault();
  heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const url = new URL(window.location.href);
  url.hash = id;
  history.replaceState(null, '', url.href);
}

function enhanceFragmentLinks(root) {
  root.querySelectorAll('a[href^="#"]').forEach((link) => {
    const raw = link.getAttribute('href');
    if (!raw || raw.length < 2) return;
    link.addEventListener('click', (event) => {
      let id;
      try { id = decodeURIComponent(raw.slice(1)); }
      catch (_) { return; }
      const target = document.getElementById(id);
      if (target) navigateToHeading(event, target, id);
    });
  });
}

function enhanceHeadings(root) {
  const headings = Array.from(root.querySelectorAll('h1,h2,h3,h4,h5,h6'));
  const outline = document.getElementById('document-outline');
  const list = outline.querySelector('ol');
  const used = new Map();
  list.replaceChildren();

  headings.forEach((heading) => {
    const label = heading.textContent.trim();
    const base = headingSlug(label);
    const duplicate = used.get(base) || 0;
    used.set(base, duplicate + 1);
    const id = duplicate ? base + '-' + duplicate : base;
    heading.id = id;

    const permalink = document.createElement('a');
    permalink.className = 'heading-anchor';
    permalink.href = '#' + id;
    permalink.textContent = '#';
    permalink.setAttribute('aria-label', 'Permalink to ' + label);
    permalink.addEventListener('click', (event) => navigateToHeading(event, heading, id));
    heading.appendChild(permalink);

    const item = document.createElement('li');
    item.style.marginLeft = ((Number(heading.tagName.slice(1)) - 1) * 10) + 'px';
    const link = document.createElement('a');
    link.href = '#' + id;
    link.textContent = label;
    link.addEventListener('click', (event) => navigateToHeading(event, heading, id));
    item.appendChild(link);
    list.appendChild(item);
  });

  outline.hidden = headings.length < 2;
  if (outline.hidden) outline.open = false;
}

function highlightCodeBlocks(root) {
  if (!window.hljs) return;
  root.querySelectorAll('pre > code[class*="language-"]').forEach((code) => {
    const languageClass = Array.from(code.classList).find((name) => name.startsWith('language-'));
    if (!languageClass) return;
    const language = languageClass.slice('language-'.length).toLowerCase();
    if (language === 'mermaid' || language === 'math' || !hljs.getLanguage(language)) return;
    hljs.highlightElement(code);
  });
}

function enhanceCodeCopy(root) {
  root.querySelectorAll('pre > code').forEach((code) => {
    const pre = code.parentElement;
    if (!pre || pre.querySelector(':scope > .code-copy-button')) return;
    if (code.classList.contains('language-mermaid') || code.classList.contains('language-math')) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'code-copy-button';
    button.textContent = 'Copy';
    button.setAttribute('aria-label', 'Copy code');
    button.addEventListener('click', async () => {
      const source = code.textContent;
      try {
        await navigator.clipboard.writeText(source);
      } catch (_) {
        const area = document.createElement('textarea');
        area.value = source;
        area.style.position = 'fixed'; area.style.opacity = '0';
        document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
      }
      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = 'Copy'; }, 1200);
    });
    pre.appendChild(button);
  });
}

function renderMath(root) {
  if (!window.katex) return;

  const options = {
    throwOnError: false,
    trust: false,
    strict: 'warn',
    maxSize: 20,
    maxExpand: 1000
  };

  root.querySelectorAll('pre > code.language-math').forEach((code) => {
    const display = document.createElement('div');
    display.className = 'math-display';
    if (code.parentElement.hasAttribute('data-sourcepos'))
      display.setAttribute('data-sourcepos', code.parentElement.getAttribute('data-sourcepos'));
    code.parentElement.replaceWith(display);
    katex.render(code.textContent, display, { ...options, displayMode: true });
  });

  if (!window.renderMathInElement) return;
  renderMathInElement(root, {
    ...options,
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false }
    ]
  });
}

function wrapMermaidBlocks() {
  const blocks = document.querySelectorAll('pre.mermaid:not([data-wrapped]), pre > code.language-mermaid');
  blocks.forEach((block) => {
    const el = block.matches('code') ? block.parentElement : block;
    if (!el || el.hasAttribute('data-wrapped')) return;
    el.setAttribute('data-wrapped', '1');
    const src = el.textContent;
    const id = 'mmd-' + (zoomSeq++);
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-wrap';
    if (el.hasAttribute('data-sourcepos')) wrap.setAttribute('data-sourcepos', el.getAttribute('data-sourcepos'));
    const toolbar = document.createElement('div');
    toolbar.className = 'mermaid-toolbar';
    toolbar.innerHTML = '<button data-act="out">-</button><button class="zoom-readout" data-act="reset">100%</button><button data-act="in">+</button>';
    const readout = toolbar.querySelector('.zoom-readout');
    const inner = document.createElement('div');
    inner.className = 'mermaid-inner';
    inner.id = id;
    inner.textContent = src;
    inner.dataset.scale = '1';
    wrap.appendChild(toolbar);
    wrap.appendChild(inner);
    el.replaceWith(wrap);

    function applyScale(scale) {
      inner.dataset.scale = String(scale);
      inner.style.transform = 'scale(' + scale + ')';
      readout.textContent = Math.round(scale * 100) + '%';
    }

    toolbar.addEventListener('click', (e) => {
      const act = e.target.getAttribute('data-act');
      if (!act) return;
      let scale = parseFloat(inner.dataset.scale || '1');
      if (act === 'in') scale = Math.min(scale * 1.2, 50);
      else if (act === 'out') scale = Math.max(scale / 1.2, 0.15);
      else scale = 1;
      applyScale(scale);
    });

    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      let scale = parseFloat(inner.dataset.scale || '1');
      scale *= (e.deltaY < 0) ? 1.1 : (1 / 1.1);
      scale = Math.min(Math.max(scale, 0.15), 50);
      applyScale(scale);
    }, { passive: false });

    let panning = false;
    let startX = 0, startY = 0, startScrollLeft = 0, startScrollTop = 0;
    let moved = false;

    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.mermaid-toolbar')) return;
      panning = true;
      moved = false;
      wrap.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      startScrollLeft = wrap.scrollLeft;
      startScrollTop = wrap.scrollTop;
      wrap.classList.add('panning');
      e.preventDefault();
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!panning) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      wrap.scrollLeft = startScrollLeft - dx;
      wrap.scrollTop = startScrollTop - dy;
    });

    function endPan(e) {
      if (!panning) return;
      panning = false;
      wrap.classList.remove('panning');
      if (wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId);
    }
    wrap.addEventListener('pointerup', endPan);
    wrap.addEventListener('pointercancel', endPan);
    wrap.addEventListener('lostpointercapture', endPan);

    wrap.addEventListener('click', (e) => {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  });
}

function updateSoloDiagramLayout() {
  const content = document.getElementById('content');
  const article = content.querySelector(':scope > .markdown-body');
  const layoutRoot = article || content;
  const children = Array.from(layoutRoot.children).filter((el) => {
    if (el.tagName === 'P' && el.textContent.trim() === '') return false;
    return true;
  });
  const solo = children.length === 1 && children[0].classList.contains('mermaid-wrap');
  content.classList.toggle('solo-diagram', solo);
}

function setContent(html) {
  // Wrap preview HTML in a container that GitHub's CSS targets.
  document.getElementById('content').innerHTML = '<article class="markdown-body">' + html + '</article>';
  const article = document.querySelector('#content > .markdown-body');
  enhanceAlerts(article);
  enhanceInlineText(article);
  enhanceFragmentLinks(article);
  enhanceHeadings(article);
  renderMath(article);
  highlightCodeBlocks(article);
  enhanceCodeCopy(article);
  wrapMermaidBlocks();
  window.__markeditRenderPromise = mermaid.run({ querySelector: '.mermaid-inner' }).catch(() => {}).then(() => updateSoloDiagramLayout());
  updateSoloDiagramLayout();
  window.setTheme(window.__markeditTheme || 'light');
}

window.setContent = setContent;

window.exportRenderedHTML = async function(baseHref, title) {
  // Export/print can otherwise run before mermaid.run() finishes, cloning
  // #content while a diagram is still an un-rendered code block. WebView2's
  // ExecuteScript waits for a returned Promise to settle, so making this
  // function async (and returning it in the end) is enough - no change
  // needed on the native side.
  if (window.__markeditRenderPromise) { try { await window.__markeditRenderPromise; } catch (_) {} }
  const source = document.querySelector('#content > .markdown-body');
  if (!source) return '';
  const article = source.cloneNode(true);
  article.querySelectorAll('.code-copy-button,.mermaid-toolbar,.heading-anchor').forEach((el) => el.remove());
  article.querySelectorAll('[data-highlighted]').forEach((el) => el.removeAttribute('data-highlighted'));
  let css = '';
  Array.from(document.styleSheets).forEach((sheet) => {
    try { css += Array.from(sheet.cssRules).map((rule) => rule.cssText).join('\n') + '\n'; }
    catch (_) {}
  });
  const escapeText = (value) => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escapeAttr = (value) => escapeText(value).replace(/"/g, '&quot;');
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + escapeText(title) + '</title><base href="' + escapeAttr(baseHref) + '"><style>' + css.replace(/<\/style/gi, '<\\/style') +
    '</style></head><body><main style="max-width:980px;margin:0 auto;padding:24px">' + article.outerHTML + '</main></body></html>';
};
</script>
