name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: choco install zig --version=0.15.2 --no-progress -y
      - name: Run test suite
        shell: cmd
        run: test.bat
      - name: Build application
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: markedit-windows-x64
          path: dist/**
